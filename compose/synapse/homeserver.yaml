# synapse homeserver configuration for carp.rodeo
#
# this is the Matrix homeserver config. user IDs will be @user:carp.rodeo.
# auth is fully delegated to Rauthy via OIDC — no local passwords.
#
# reference: https://element-hq.github.io/synapse/latest/usage/configuration/config_documentation.html

server_name: "carp.rodeo"
public_baseurl: "https://synapse.carp.rodeo"
serve_server_wellknown: true

pid_file: /data/homeserver.pid

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses: ["0.0.0.0"]
    resources:
      - names: [client, federation]
        compress: false

# --- database ---

database:
  name: psycopg2
  args:
    user: synapse
    password: "POSTGRES_PASSWORD_PLACEHOLDER"
    database: synapse
    host: postgres
    port: 5432
    cp_min: 5
    cp_max: 10

# --- OIDC (Rauthy) ---
# all authentication goes through Rauthy. synapse's own passwords are disabled.

oidc_providers:
  - idp_id: rauthy
    idp_name: "carp.rodeo"
    discover: true
    issuer: "https://auth.carp.rodeo/auth/v1"
    client_id: "synapse"
    client_secret: "OIDC_SECRET_PLACEHOLDER"
    scopes:
      - "openid"
      - "profile"
      - "email"
    user_mapping_provider:
      config:
        localpart_template: "{{ user.preferred_username }}"
        display_name_template: "{{ user.name }}"
        email_template: "{{ user.email }}"

# disable synapse's own registration and passwords — rauthy handles everything
enable_registration: false

password_config:
  enabled: false

# --- encryption ---

# enable E2EE by default for all new rooms (DMs and group chats)
encryption_enabled_by_default_for_room_type: all

# --- media ---

media_store_path: "/data/media_store"
max_upload_size: "50M"
# require authentication to fetch media (Matrix v1.11+)
authenticated_media: true

# OVH S3 media storage
media_storage_providers:
  - module: s3_storage_provider.S3StorageProviderBackend
    store_local: true
    store_remote: true
    store_synchronous: true
    config:
      bucket: "S3_MEDIA_BUCKET_PLACEHOLDER"
      region_name: "S3_REGION_PLACEHOLDER"
      endpoint_url: "S3_ENDPOINT_PLACEHOLDER"
      access_key_id: "S3_ACCESS_KEY_PLACEHOLDER"
      secret_access_key: "S3_SECRET_KEY_PLACEHOLDER"

# --- general ---

report_stats: false
signing_key_path: "/data/carp.rodeo.signing.key"
trusted_key_servers: []

suppress_key_server_warning: true

# --- logging ---

log_config: "/data/log.config"

# --- email (Resend) ---
email:
  smtp_host: "smtp.resend.com"
  smtp_port: 2465
  smtp_user: "resend"
  smtp_pass: "SMTP_PASSWORD_PLACEHOLDER"
  require_transport_security: true
  notif_from: "carp.rodeo matrix <matrix@carp.rodeo>"
