# rauthy configuration for carp.rodeo
#
# secrets (ENC_KEYS, HQL_SECRET_*, SMTP_*) are injected via environment
# variables in docker-compose.yml — do NOT put them in this file.
#
# reference: https://sebadob.github.io/rauthy/config/config.html

[access]
userinfo_strict = true
session_validate_ip = true
sec_header_block = true
peer_ip_header_name = 'X-Forwarded-For'

[bootstrap]
# change this — first admin gets this email
# overridden by BOOTSTRAP_ADMIN_EMAIL env var
admin_email = 'admin@carp.rodeo'
# pre-create groups, scopes, user attributes, and OIDC clients on first boot
bootstrap_dir = 'bootstrap'

[cluster]
node_id = 1
nodes = ["1 localhost:8100 localhost:8200"]

[database]
# use Hiqlite (embedded SQLite) — recommended for single-node
hiqlite = true
# backup S3 values injected via env vars: HQL_S3_URL, HQL_S3_BUCKET, etc.

[email]
rauthy_admin_email = 'admin@carp.rodeo'
sub_prefix = 'carp.rodeo'
# SMTP values injected via env vars: SMTP_URL, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM
# Resend SMTP: smtp.resend.com:2465, username=resend, password=re_xxxxx
smtp_url = 'smtp.resend.com'
smtp_from = 'carp.rodeo <auth@carp.rodeo>'

[encryption]
# MUST be overridden via ENC_KEYS and ENC_KEY_ACTIVE env vars
# generate keys: openssl rand -base64 32
keys = []
key_active = ''

[events]
email = 'admin@carp.rodeo'
notify_level_email = 'warning'
# matrix notifications — configure after synapse is running
# to avoid chicken-and-egg panic on first boot
#matrix_user_id = '@rauthy:carp.rodeo'
#matrix_room_id = '!xxxxx:carp.rodeo'
#matrix_access_token = ''
#matrix_server_url = 'https://synapse.carp.rodeo'
#matrix_error_no_panic = true

[hashing]
# tuned for 2 vCPU / 16GB RAM
argon2_m_cost = 131072
argon2_t_cost = 4
argon2_p_cost = 4
max_hash_threads = 1

[lifetimes]
session_lifetime = 28800
session_timeout = 7200
# magic link for first password setup — 7 days (plenty of time for invite)
magic_link_pwd_first = 10080
# magic link for password reset — 30 min
magic_link_pwd_reset = 30

[logging]
level = 'info'
level_access = 'modifying'

[mfa]
admin_force_mfa = true

[server]
listen_address = '0.0.0.0'
port_http = 8080
scheme = 'http'
pub_url = 'auth.carp.rodeo'
proxy_mode = true
trusted_proxies = ['172.16.0.0/12', '10.0.0.0/8']

[user_pictures]
# avatar storage — S3 since we already have OVH S3
# env vars: PIC_S3_URL, PIC_S3_BUCKET, PIC_S3_REGION, PIC_S3_KEY, PIC_S3_SECRET
storage_type = 's3'
s3_path_style = true
# let Matrix clients and other apps fetch avatars without a Rauthy session
public = true

[user_registration]
enable = false

[user_values]
# username is the primary identifier — hide name/address fields
given_name = 'hidden'
family_name = 'hidden'
birthdate = 'hidden'
street = 'hidden'
zip = 'hidden'
city = 'hidden'
country = 'hidden'
phone = 'hidden'

[user_values.preferred_username]
preferred_username = 'required'
immutable = false
blacklist = ['admin', 'administrator', 'root', 'system', 'rauthy']

[webauthn]
rp_id = 'carp.rodeo'
rp_origin = 'https://auth.carp.rodeo:443'
rp_name = 'carp.rodeo'
force_uv = true
no_password_exp = true
renew_exp = 2160
