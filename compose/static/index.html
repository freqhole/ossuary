<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>carp.rodeo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #0a0a0a;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container { text-align: center; }

      margin-top: 2rem;
      display: flex;

      text-decoration: none;
      font-size: 0.85rem;

      transition: color 0.2s;

    a:hover { color: #ccc; }
    .sep { color: #333; }

      color: #444;

  <div class="container">

      <a href="https://auth.carp.rodeo">auth</a>
