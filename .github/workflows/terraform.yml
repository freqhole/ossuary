name: terraform

on:
  push:
    branches: [main]
    paths: [infra/**]
  pull_request:
    branches: [main]
    paths: [infra/**]

permissions:
  contents: read
  pull-requests: write

env:
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: install sops
        run: |
          curl -LO https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          chmod +x sops-v3.9.4.linux.amd64
          sudo mv sops-v3.9.4.linux.amd64 /usr/local/bin/sops

      - name: decrypt terraform variables
        run: sops -d infra/terraform.tfvars.enc > infra/terraform.tfvars.plaintext

      - name: terraform init
        working-directory: infra
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

      - name: terraform plan
        working-directory: infra
        run: terraform plan -no-color -var-file=terraform.tfvars.plaintext -out=tfplan

      - name: cleanup plaintext
        if: always()
        run: rm -f infra/terraform.tfvars.plaintext

      - name: comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const plan = execSync('cd infra && terraform show -no-color tfplan').toString();
            const body = `### terraform plan\n\n\`\`\`\n${plan.substring(0, 60000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  apply:
    name: terraform apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: install sops
        run: |
          curl -LO https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          chmod +x sops-v3.9.4.linux.amd64
          sudo mv sops-v3.9.4.linux.amd64 /usr/local/bin/sops

      - name: decrypt terraform variables
        run: sops -d infra/terraform.tfvars.enc > infra/terraform.tfvars.plaintext

      - name: terraform init
        working-directory: infra
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

      - name: terraform apply
        working-directory: infra
        run: terraform apply -auto-approve -var-file=terraform.tfvars.plaintext

      - name: cleanup plaintext
        if: always()
        run: rm -f infra/terraform.tfvars.plaintext
